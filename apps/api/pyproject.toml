[project]
name = "owndraft-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=1,<2",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "mypy>=1,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owndraft"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["../../tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["owndraft"]
